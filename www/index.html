<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f5f1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; img-src 'self' data: blob:; media-src 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/launcher.css?v=20261023-phone-workspaces-v1">
    <title>叙界 · 工作区</title>
  </head>
  <body>
    <main>
      <header class="launcher-brand"><img src="/icon.svg" alt=""><span>叙界 <small>SCRIVERSE</small></span><button id="local-ai-open" class="icon-button" type="button" aria-label="本机 AI 设置"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="4"/><path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4M9 9h6v6H9z"/></svg></button></header>
      <section class="welcome-copy"><span class="eyebrow">你的随身创作空间</span><h1>让故事，<br>在手边继续。</h1><p>连接你的 Server，或者从手机里的副本开始。</p></section>
      <section aria-labelledby="server-list-title" class="workspace-section">
        <div class="section-heading"><h2 id="server-list-title">我的工作区</h2><button id="add-server" class="text-button" type="button"><span aria-hidden="true">＋</span> 添加工作区</button></div>
        <p id="server-summary" class="section-meta" role="status">正在读取工作区……</p>
        <div id="server-list" class="server-list" aria-live="polite" aria-busy="true"></div>
      </section>
      <section class="local-note"><span class="local-note-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8 12 3 3 5-6"/></svg></span><div><strong>写下的每一句，都留在手边</strong><p>下载作品后可离线编辑正文与设定库。重新在线进入时，按版本同步你的修改。</p></div></section>
      <footer><span>为长篇创作而生</span><span id="app-version" class="app-version" aria-live="polite">正在读取版本……</span></footer>
    </main>
    <dialog id="server-editor" class="launcher-dialog" aria-labelledby="server-form-title">
      <form id="server-form">
        <div class="dialog-heading"><div><span class="eyebrow">Server 连接</span><h2 id="server-form-title">添加工作区</h2></div><button id="cancel-server" class="icon-button" type="button" aria-label="关闭工作区设置">×</button></div>
        <label>显示名称<input id="server-name" name="name" maxlength="80" autocomplete="organization" required placeholder="例如：我的创作工作区"></label>
        <label>Server 地址<input id="server-origin" name="origin" type="url" maxlength="2048" inputmode="url" autocomplete="url" spellcheck="false" required placeholder="https://example.com"></label>
        <small>填写完整的 HTTP 或 HTTPS origin，不附加路径。账户和作品由你选择的 Server 管理。</small>
        <p id="server-form-error" class="error" role="alert" hidden></p>
        <div class="form-actions"><button type="submit" class="primary-button">保存并连接</button></div>
      </form>
    </dialog>
    <script type="module" src="/launcher.js?v=20261023-phone-workspaces-v1"></script>
  </body>
</html>
